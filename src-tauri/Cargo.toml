[package]
name = "local-file-explorer"
version = "0.1.0"
description = "Local File Explorer — media library filter and MPC playlist opener"
authors = ["you"]
edition = "2021"

[lib]
name = "local_file_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
walkdir = "2"
thiserror = "2"
parking_lot = "0.12"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"
rfd = "0.16"
